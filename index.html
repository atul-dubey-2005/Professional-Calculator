<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Authentication Container -->
    <div class="auth-container" id="auth-box">
        
        <!-- Login Form -->
        <div id="login-form" class="auth-form">
            <h2><i class="fa-solid fa-user-lock"></i> Login</h2>
            <input type="text" id="login-username" placeholder="Username" autocomplete="off">
            <input type="password" id="login-password" placeholder="Password">
            <button class="auth-btn" onclick="login()">Login</button>
            <p class="auth-switch">Don't have an account? <span onclick="toggleAuth()">Sign up here</span></p>
            <p id="login-error" class="error-msg"></p>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="auth-form" style="display: none;">
            <h2><i class="fa-solid fa-user-plus"></i> Sign Up</h2>
            <input type="text" id="signup-username" placeholder="Choose a Username" autocomplete="off">
            <input type="password" id="signup-password" placeholder="Create a Password">
            <button class="auth-btn" onclick="signup()">Sign Up</button>
            <p class="auth-switch">Already have an account? <span onclick="toggleAuth()">Login here</span></p>
            <p id="signup-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Calculator Container -->
    <div class="container" id="calc-box" style="display: none;">
        <div class="calculator">
            
            <div class="header">
                <h2><i class="fa-solid fa-flask"></i> Scientific Calc</h2>
                <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>

            <div class="display-container">
                <input type="text" id="display" placeholder="0" readonly>
            </div>

            <div class="buttons">
                <!-- Row 1 -->
                <button class="sci-btn" onclick="appendValue('sin(')">sin</button>
                <button class="sci-btn" onclick="appendValue('cos(')">cos</button>
                <button class="sci-btn" onclick="appendValue('tan(')">tan</button>
                <button class="operator" onclick="clearDisplay()">AC</button>
                <button class="operator" onclick="deleteLast()">DEL</button>

                <!-- Row 2 -->
                <button class="sci-btn" onclick="appendValue('log(')">log</button>
                <button class="sci-btn" onclick="appendValue('ln(')">ln</button>
                <button class="sci-btn" onclick="appendValue('(')">(</button>
                <button class="sci-btn" onclick="appendValue(')')">)</button>
                <button class="operator" onclick="appendValue('/')">÷</button>

                <!-- Row 3 -->
                <button class="sci-btn" onclick="appendValue('√(')">√</button>
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>

                <!-- Row 4 -->
                <button class="sci-btn" onclick="appendValue('^')">xʸ</button>
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">−</button>

                <!-- Row 5 -->
                <button class="sci-btn" onclick="appendValue('π')">π</button>
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <!-- Row 6 -->
                <button class="sci-btn" onclick="appendValue('e')">e</button>
                <button class="sci-btn" onclick="appendValue('!')">x!</button>
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
