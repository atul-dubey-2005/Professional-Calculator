<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Pro Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Authentication Container -->
    <div class="auth-container" id="auth-box">
        <!-- Login Form -->
        <div id="login-form" class="auth-form">
            <h2><i class="fa-solid fa-user-lock"></i> Welcome Back</h2>
            <input type="text" id="login-identifier" placeholder="Username or Email" autocomplete="off">
            <input type="password" id="login-password" placeholder="Password">
            <button class="auth-btn" onclick="login()">Login</button>
            <p class="auth-switch">Don't have an account? <span onclick="toggleAuth()">Sign up here</span></p>
            <p id="login-error" class="error-msg"></p>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="auth-form" style="display: none;">
            <h2><i class="fa-solid fa-user-plus"></i> Create Account</h2>
            <input type="text" id="signup-username" placeholder="Username" autocomplete="off">
            <input type="email" id="signup-email" placeholder="Email Address" autocomplete="off">
            <input type="password" id="signup-password" placeholder="Create Password">
            <button class="auth-btn" onclick="signup()">Sign Up</button>
            <p class="auth-switch">Already have an account? <span onclick="toggleAuth()">Login here</span></p>
            <p id="signup-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Main Calculator Container -->
    <div class="container" id="calc-box" style="display: none;">
        
        <!-- History Drawer -->
        <div class="history-panel" id="history-panel">
            <div class="history-header">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> History</h3>
                <button class="icon-btn" onclick="clearHistory()"><i class="fa-solid fa-trash-can"></i> Clear</button>
            </div>
            <div class="history-list" id="history-list">
                <p class="empty-msg">No history yet.</p>
            </div>
        </div>

        <!-- Calculator UI -->
        <div class="calculator">
            <!-- Header Bar -->
            <div class="header">
                <div class="user-info">
                    <i class="fa-solid fa-user-circle"></i>
                    <span id="user-display">User</span>
                </div>
                <div class="header-actions">
                    <button class="badge-btn" id="angle-mode-btn" onclick="toggleAngleMode()">DEG</button>
                    <button class="badge-btn" id="memory-badge" style="display:none;">M</button>
                    <button class="icon-btn" onclick="toggleHistory()"><i class="fa-solid fa-history"></i></button>
                    <button class="icon-btn logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <!-- Screen Display -->
            <div class="display-container">
                <div id="sub-display"></div>
                <input type="text" id="display" placeholder="0" readonly>
            </div>

            <!-- Keypad Grid (6 Columns) -->
            <div class="buttons">
                <!-- Memory Row -->
                <button class="mem-btn" onclick="handleMemory('MC')">MC</button>
                <button class="mem-btn" onclick="handleMemory('MR')">MR</button>
                <button class="mem-btn" onclick="handleMemory('M+')">M+</button>
                <button class="mem-btn" onclick="handleMemory('M-')">M-</button>
                <button class="mem-btn" onclick="handleMemory('MS')">MS</button>
                <button class="operator" onclick="clearDisplay()">AC</button>

                <!-- Mode / Shift Row -->
                <button class="sci-btn active-toggle" id="shift-btn" onclick="toggleShift()">2nd</button>
                <button class="sci-btn func-normal" onclick="appendValue('sin(')">sin</button>
                <button class="sci-btn func-shift" onclick="appendValue('asin(')" style="display:none;">asin</button>

                <button class="sci-btn func-normal" onclick="appendValue('cos(')">cos</button>
                <button class="sci-btn func-shift" onclick="appendValue('acos(')" style="display:none;">acos</button>

                <button class="sci-btn func-normal" onclick="appendValue('tan(')">tan</button>
                <button class="sci-btn func-shift" onclick="appendValue('atan(')" style="display:none;">atan</button>

                <button class="sci-btn" onclick="appendValue('(')">(</button>
                <button class="sci-btn" onclick="appendValue(')')">)</button>

                <!-- Hyperbolic / Logarithm Row -->
                <button class="sci-btn func-normal" onclick="appendValue('sinh(')">sinh</button>
                <button class="sci-btn func-shift" onclick="appendValue('asinh(')" style="display:none;">asinh</button>

                <button class="sci-btn func-normal" onclick="appendValue('cosh(')">cosh</button>
                <button class="sci-btn func-shift" onclick="appendValue('acosh(')" style="display:none;">acosh</button>

                <button class="sci-btn func-normal" onclick="appendValue('tanh(')">tanh</button>
                <button class="sci-btn func-shift" onclick="appendValue('atanh(')" style="display:none;">atanh</button>

                <button class="sci-btn func-normal" onclick="appendValue('log(')">log</button>
                <button class="sci-btn func-shift" onclick="appendValue('10^(')" style="display:none;">10ˣ</button>

                <button class="sci-btn func-normal" onclick="appendValue('ln(')">ln</button>
                <button class="sci-btn func-shift" onclick="appendValue('e^(')" style="display:none;">eˣ</button>

                <button class="operator" onclick="deleteLast()">DEL</button>

                <!-- Powers & Roots -->
                <button class="sci-btn func-normal" onclick="appendValue('^2')">x²</button>
                <button class="sci-btn func-shift" onclick="appendValue('^3')" style="display:none;">x³</button>

                <button class="sci-btn" onclick="appendValue('^')">xʸ</button>

                <button class="sci-btn func-normal" onclick="appendValue('√(')">√</button>
                <button class="sci-btn func-shift" onclick="appendValue('∛(')" style="display:none;">∛</button>

                <button class="sci-btn" onclick="appendValue('1/(')">1/x</button>
                <button class="sci-btn" onclick="appendValue('abs(')">|x|</button>
                <button class="operator" onclick="appendValue('/')">÷</button>

                <!-- Keypad 7-9 & Mod -->
                <button class="sci-btn" onclick="appendValue('!')">n!</button>
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="sci-btn" onclick="appendValue('%')">%</button>
                <button class="operator" onclick="appendValue('*')">×</button>

                <!-- Keypad 4-6 & Constants -->
                <button class="sci-btn" onclick="appendValue('π')">π</button>
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="sci-btn" onclick="appendValue(' mod ')">mod</button>
                <button class="operator" onclick="appendValue('-')">−</button>

                <!-- Keypad 1-3 & Negation -->
                <button class="sci-btn" onclick="appendValue('e')">e</button>
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="sci-btn" onclick="toggleNegate()">±</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <!-- Bottom Row -->
                <button onclick="appendValue('00')">00</button>
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" style="grid-column: span 3;" onclick="calculate()">=</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
